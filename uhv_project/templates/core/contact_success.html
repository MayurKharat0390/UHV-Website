{% extends 'base.html' %}

{% block title %}Message Sent - UHV PCCOE{% endblock %}

{% block content %}
<section class="py-32">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <div
            class="w-24 h-24 bg-accent-100 rounded-full flex items-center justify-center text-accent-600 mx-auto mb-8 animate-bounce">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1 class="text-4xl md:text-5xl font-serif font-black text-gray-900 mb-6">Message Sent!</h1>
        <p class="text-xl text-gray-600 mb-12 font-medium">Thank you for reaching out to the UHV Department. Your
            inquiry has been received, and we'll get back to you shortly.</p>
        <a href="{% url 'core:home' %}"
            class="inline-block bg-primary-600 text-white px-10 py-4 rounded-full font-bold shadow-lg hover:bg-primary-700 transition-all">
            Return Home
        </a>
    </div>
</section>
{% endblock %}
